[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssl-demo"
version = "0.1.0"
description = "Self-supervised features for pathology tiles: frozen backbones, one anomaly head."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "Pillow>=10",
    "medmnist==3.0.2",
    "timm==1.0.31",
    "umap-learn==0.6.0",
    "h5py==3.16.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
wsi = ["openslide-python==1.4.7", "openslide-bin==4.0.1.2"]
ssl = ["lightly==1.6.1"]
dev = ["pytest==8.4.1"]

# Local installs use `uv sync`. Torch is not a project dependency: the Colab
# setup cell runs `pip install -e .`, and a torch pin there would replace the
# preinstalled CUDA wheel. `uv sync` still installs CPU wheels via this group.
[dependency-groups]
dev = ["pytest==8.4.1"]
cpu = ["torch==2.14.1", "torchvision==0.29.2"]

[tool.uv]
default-groups = ["dev", "cpu"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
